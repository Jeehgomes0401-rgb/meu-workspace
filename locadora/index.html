<title>Gestão da Locadora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de bolso — cabeçalho fixo, conteúdo em coluna única (até 960px), navegação inferior; formulários abrem numa folha deslizante. */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface2:#E3E7EE; --line:#D2D8E1;
  --fg:#1D222B; --muted:#5A6272; --accent:#283447; --accent-fg:#FFFFFF; --accent-soft:#DCE3EE;
  --brand-red:#8E5A57; --head-bg:#2B2D33; --head-fg:#E4E4E8; --head-muted:#A3A8B4;
  --in:#1E7A4C; --out:#B3261E; --warn:#9A5600; --warn-soft:#FBEACF; --bad-soft:#F8DCD9;
  --plate-bg:#FFFFFF; --plate-fg:#111111; --plate-band:#0A3A9C; --plate-line:#9AA3B0;
  --shadow:0 10px 30px rgba(20,26,40,.2);
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1D22; --surface:#24272E; --surface2:#2D3139; --line:#3A3F49;
  --fg:#E4E4E8; --muted:#9BA1AE; --accent:#8FA6CB; --accent-fg:#141A24; --accent-soft:#2C3648;
  --brand-red:#B07A76; --head-bg:#24262C; --head-fg:#E4E4E8; --head-muted:#9BA1AE;
  --in:#55C98F; --out:#F2877E; --warn:#F0B45C; --warn-soft:#3A2A11; --bad-soft:#3E1D1A;
  --plate-line:#5D6470; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1B1D22; --surface:#24272E; --surface2:#2D3139; --line:#3A3F49;
  --fg:#E4E4E8; --muted:#9BA1AE; --accent:#8FA6CB; --accent-fg:#141A24; --accent-soft:#2C3648;
  --brand-red:#B07A76; --head-bg:#24262C; --head-fg:#E4E4E8; --head-muted:#9BA1AE;
  --in:#55C98F; --out:#F2877E; --warn:#F0B45C; --warn-soft:#3A2A11; --bad-soft:#3E1D1A;
  --plate-line:#5D6470; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-fg);border-bottom:3px solid var(--accent)}
.top-in,.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.top .btn.pri{background:var(--brand-red);border-color:var(--brand-red);color:#FFFFFF}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:54px;height:54px;flex:none;display:block;background:#E4E4E8;border-radius:13px;padding:4px}
.brand h1{font-size:clamp(15px,4.3vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--head-muted);font-size:12px;font-family:var(--f-body)}
.top .sp{flex:1}
.wrap{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav button{background:none;border:0;padding:9px 0 10px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] .pill{background:var(--accent-soft)}
.nav .pill{padding:3px 12px;border-radius:99px;display:grid;place-items:center}

.banner{border-radius:12px;padding:12px 14px;margin-bottom:16px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--line);font-size:14px}
.sec{display:grid;gap:12px;margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:clamp(17px,4.6vw,24px);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.in b{color:var(--in)} .kpi.out b{color:var(--out)}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}.kpis .kpi.bal{grid-column:1 / -1}}

.fleet{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--fg);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--out)}
.chip.ex{background:var(--surface2);color:var(--muted);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow{flex:1;min-width:0}
.t{font-weight:600}
.sub{color:var(--muted);font-size:13.5px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.alert{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:11px 13px}
.alert.bad{border-left-color:var(--out)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--out)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.icon-btn{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted)}

/* placa no padrão Mercosul */
.plate{flex:none;width:96px;border:2px solid var(--plate-line);border-radius:7px;background:var(--plate-bg);color:var(--plate-fg);overflow:hidden;text-align:center}
.plate i{display:block;background:var(--plate-band);color:#fff;font-style:normal;font-size:7.5px;letter-spacing:.2em;font-weight:700;padding:1px 0;font-family:var(--f-body)}
.plate span{display:block;font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.04em;padding:3px 2px 4px}
.plate.moto{width:70px}
.plate.moto span{font-size:12.5px;line-height:1.15;padding:2px 2px 3px}

.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

.money.in{color:var(--in)} .money.out{color:var(--out)}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);flex:none}
.tx-ic.in{color:var(--in)} .tx-ic.out{color:var(--out)}
.tx-ic svg{width:18px;height:18px}
.tx .money{font-weight:700;font-family:var(--f-mono);font-size:14px;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}

.monthbar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.monthbar b{flex:1;text-align:center;font-family:var(--f-display)}

.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;padding:10px 4px 0}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.chart .bars{flex:1;width:100%;display:flex;gap:3px;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.chart .b{width:min(18px,40%);border-radius:4px 4px 0 0;min-height:2px}
.chart .b.in{background:var(--in)} .chart .b.out{background:var(--out)}
.chart small{font-size:11px;color:var(--muted);text-transform:capitalize}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}

/* folha do formulário */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(5,15,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h2{font-size:20px}
form{display:grid;gap:14px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}
legend{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;padding:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.full{grid-column:1 / -1}
@media (max-width:460px){.grid.g3{grid-template-columns:1fr 1fr}}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:400;font-size:16px;min-width:0}
label.f textarea{min-height:64px;resize:vertical}
.hint{font-size:12.5px;font-weight:400;color:var(--muted)}
.hint.ok{color:var(--in)} .hint.bad{color:var(--out)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg input:checked + span{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible + span{outline:2px solid var(--accent)}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.form-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:12px 0 4px;border-top:1px solid var(--line)}
.form-foot .r{display:flex;gap:8px;margin-left:auto}
.sum{font-family:var(--f-mono);font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
/* dashboard */
:root{--c-in:#2F63B8;--c-out:#C8572B;--grid:#E3E7EE}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-in:#5E8FE0;--c-out:#D9733F;--grid:#30343C}}
:root[data-theme="dark"]{--c-in:#5E8FE0;--c-out:#D9733F;--grid:#30343C}
.perbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;gap:10px}
.perbar .seg label span{padding:7px 4px;font-size:13px}
.perrow{display:flex;align-items:center;gap:6px}
.perdates{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.perdates label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.perdates input{width:100%;min-width:0;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px}
.perlabel{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:var(--f-display);font-size:16px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.kpis.k4{grid-template-columns:1fr 1fr}.kpis.k4 .kpi.bal{grid-column:auto}}
.kpi .dl{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.kpi .dl.up{color:var(--in)} .kpi .dl.down{color:var(--out)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.in{background:var(--c-in)} .sw.out{background:var(--c-out)}
.legend .sw{margin-right:0}
.chartbox{position:relative;padding:12px 14px 8px;overflow:hidden}
.ch{display:block;max-width:100%;height:auto;overflow:visible}
.ch .grid{stroke:var(--grid);stroke-width:1} .ch .base{stroke:var(--muted);stroke-width:1}
.ch .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)} .ch .ax.strong{fill:var(--fg);font-weight:700;font-size:12px}
.ch .b-in{fill:var(--c-in)} .ch .b-out{fill:var(--c-out)}
.ch .hit{fill:transparent;cursor:crosshair} .ch .hit:hover{fill:var(--fg);fill-opacity:.05}
.ch .sal-line{fill:none;stroke:var(--c-in);stroke-width:2;stroke-linejoin:round}
.ch .sal-area{fill:var(--c-in);fill-opacity:.12}
.ch .sal-end{fill:var(--c-in);stroke:var(--surface);stroke-width:2}
.ch .xhair{stroke:var(--muted);stroke-dasharray:3 3}
.ch .xhair[hidden],.tip[hidden]{display:none}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12.5px;display:grid;gap:2px;min-width:150px}
.tip span{display:flex;align-items:center;font-variant-numeric:tabular-nums}
details.tbl{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
details.tbl summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.panel.pad{padding:12px 14px}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:10px;background:var(--surface2);border-radius:0 4px 4px 0;overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:0 4px 4px 0}
.hb-track i.in{background:var(--c-in)} .hb-track i.out{background:var(--c-out)}
.hb-v{font-weight:600}
.head-ic{color:var(--head-fg);opacity:.85}
.head-ic:hover{opacity:1;background:rgba(255,255,255,.08)}
.btn.wa{color:#FFFFFF;background:#1F8F4E;border-color:#1F8F4E;text-decoration:none}
.btn.wa:hover{filter:brightness(1.08);background:#1F8F4E}
a.btn{text-decoration:none;color:inherit}
a.btn.wa{color:#FFFFFF}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg class="brand-mark" viewBox="130 -10 1710 1750" role="img" aria-label="Logo JR">
  <path d="M985 4 L1662 189 L1662 800 Q1662 925 1625 1000 L345 1000 Q308 925 308 800 L308 189 Z" fill="#283447" stroke="#3A3B3F" stroke-width="7" stroke-linejoin="round"/>
  <path d="M985 122 L1562 279 L1562 800 Q1562 880 1545 940 L430 940 Q410 880 410 800 L410 279 Z" fill="#2B2D33"/>
  <text x="985" y="632" text-anchor="middle" font-family="Archivo, 'Arial Black', Arial, sans-serif" font-weight="800" font-size="530" letter-spacing="-10" fill="#E4E4E8">JR</text>
  <path d="M150 1180 Q985 300 1818 1172 Q985 2262 150 1180 Z" fill="#283447" stroke="#3A3B3F" stroke-width="7" stroke-linejoin="round"/>
  <path d="M276 1180 Q985 470 1694 1180 Q985 2100 276 1180 Z" fill="#2B2D33"/>
  <circle cx="985" cy="1185" r="310" fill="#283447"/>
  <circle cx="985" cy="1185" r="202" fill="#2B2D33"/>
  <path d="M1110 940 A275 275 0 0 1 925 1455" fill="none" stroke="#E4E4E8" stroke-width="108"/>
  <circle cx="1058" cy="1118" r="58" fill="#8E5A57"/>
</svg>
      <div style="min-width:0"><h1>Gestão da Locadora</h1><small id="sync">Conectando…</small></div>
    </div>
    <div class="sp"></div>
    <button class="icon-btn head-ic" data-act="empresa" aria-label="Dados da locadora" title="Dados da locadora"></button>
    <button class="btn pri sm" data-act="quick" id="quick-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Lançar</button>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav class="nav" aria-label="Seções">
  <div class="nav-in" id="nav">
    <button data-view="painel"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>Painel</button>

function tempoPartes(d){const m=Math.floor(d/30),r=d%30,w=Math.floor(r/7),dd=r%7,p=[];
  if(m)p.push([m,m===1?"mês":"meses","m"]);if(w)p.push([w,w===1?"semana":"semanas","f"]);if(dd)p.push([dd,dd===1?"dia":"dias","m"]);return p}

function venceTxt(d){return d===0?"Vence hoje":d===1?"Vence amanhã":"Vence em "+tempoTxt(d)}

    const hoje=todayIso();while(abertas<300&&addPeriod(l.inicio,l.frequencia||"mensal",pagos.length+abertas)<hoje)abertas++;
    const d=days(hoje,prox);
    st=d<0?{txt:vencidoTxt(-d).replace(/^./,c=>c.toUpperCase()),cls:"bad",d}:d<=3?{txt:venceTxt(d),cls:"warn",d}:{txt:"Em dia",cls:"ok",d};
  }
  return{pagos:pagos.length,total,prox,st,abertas,devido:abertas*(+l.valor||0)};
}

/* ---------- Dashboard: período selecionável ---------- */
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function weekStart(s){const d=pd(s),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)}
function periodoDe(modo,ref){
  if(modo==="semana"){const a=weekStart(ref);return{modo,ini:a,fim:addDays(a,6)}}
  if(modo==="quinzena"){const d=pd(ref),y=d.getFullYear(),m=d.getMonth();return d.getDate()<=15?{modo,ini:iso(new Date(y,m,1)),fim:iso(new Date(y,m,15))}:{modo,ini:iso(new Date(y,m,16)),fim:iso(new Date(y,m+1,0))}}
  if(modo==="mes"){const d=pd(ref);return{modo,ini:iso(new Date(d.getFullYear(),d.getMonth(),1)),fim:iso(new Date(d.getFullYear(),d.getMonth()+1,0))}}
  return per;
}
let per=periodoDe("semana",todayIso());
function shiftPer(dir){
  if(per.modo==="semana")per=periodoDe("semana",addDays(per.ini,7*dir));
  else if(per.modo==="quinzena")per=periodoDe("quinzena",dir>0?addDays(per.fim,1):addDays(per.ini,-1));
  else if(per.modo==="mes")per=periodoDe("mes",dir>0?addDays(per.fim,1):addDays(per.ini,-1));
  else{const n=days(per.ini,per.fim)+1;per={modo:"livre",ini:addDays(per.ini,n*dir),fim:addDays(per.fim,n*dir)}}
}
const perAnterior=p=>{const n=days(p.ini,p.fim)+1;return{ini:addDays(p.ini,-n),fim:addDays(p.ini,-1)}};

function perLabel(p){const a=pd(p.ini),b=pd(p.fim);
  if(p.ini===p.fim)return a.getDate()+" de "+MESC[a.getMonth()]+" "+a.getFullYear();
  return a.getDate()+(a.getMonth()!==b.getMonth()?" "+MESC[a.getMonth()]:"")+(a.getFullYear()!==b.getFullYear()?" "+a.getFullYear():"")+" a "+b.getDate()+" "+MESC[b.getMonth()]+" "+b.getFullYear()}
const NOME_PER={semana:"semana",quinzena:"quinzena",mes:"mês",livre:"período"};
function kfmt(v){const a=Math.abs(v);return (v<0?"−":"")+(a>=1000?(a/1000).toLocaleString("pt-BR",{maximumFractionDigits:a>=10000?0:1})+" mil":a.toLocaleString("pt-BR",{maximumFractionDigits:0}))}
function niceStep(range,n){const raw=range/n||1,p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,2.5,5,10])if(m*p>=raw)return m*p;return 10*p}

function buckets(p){
  const n=days(p.ini,p.fim)+1, out=[];
  if(n<=31){for(let i=0;i<n;i++){const d=addDays(p.ini,i),dt=pd(d);out.push({a:d,b:d,lbl:n<=8?DSEM[dt.getDay()]+" "+dt.getDate():String(dt.getDate()),tip:DSEM[dt.getDay()]+", "+fd(d)})}}
  else if(n<=124){let a=p.ini;while(a<=p.fim){const b0=addDays(weekStart(a),6),b=b0>p.fim?p.fim:b0;out.push({a,b,lbl:fd(a).slice(0,5),tip:fd(a).slice(0,5)+" a "+fd(b).slice(0,5)});a=addDays(b,1)}}
  else{let a=p.ini;while(a<=p.fim){const d=pd(a),e=iso(new Date(d.getFullYear(),d.getMonth()+1,0)),b=e>p.fim?p.fim:e;out.push({a,b,lbl:MESC[d.getMonth()]+(d.getMonth()===0?" "+String(d.getFullYear()).slice(2):""),tip:MESC[d.getMonth()]+" "+d.getFullYear()});a=addDays(b,1)}}
  out.forEach(k=>{const t=txEntre(k.a,k.b);k.e=sumT(t,"receita");k.s=sumT(t,"despesa")});
  return out;
}
function chartW(){const m=$("#main");return Math.max(280,Math.min(928,(m?m.clientWidth:400)-32-30))}
function barPath(x,y,w,h){if(h<=0.5)return"";const r=Math.min(4,w/2,h);return"M"+x+","+(y+h)+"V"+(y+r)+"Q"+x+","+y+" "+(x+r)+","+y+"H"+(x+w-r)+"Q"+(x+w)+","+y+" "+(x+w)+","+(y+r)+"V"+(y+h)+"Z"}
function xLabels(bk,W,L,R){const slot=(W-L-R)/bk.length, every=Math.max(1,Math.ceil(46/slot));
  return bk.map((k,i)=>(i%every===0||i===bk.length-1&&bk.length-1-i>=0&&(bk.length-1)%every>=every/2)?'<text x="'+(L+slot*(i+.5))+'" y="__H__" text-anchor="middle" class="ax">'+esc(k.lbl)+'</text>':"").join("")}

function chartBars(bk){
  const W=chartW(),H=210,L=46,R=8,T=12,B=26,ph=H-T-B;
  const mx=Math.max(1,...bk.map(k=>Math.max(k.e,k.s))),st=niceStep(mx,4),top=Math.ceil(mx/st)*st;
  const y=v=>T+ph-(v/top)*ph, slot=(W-L-R)/bk.length, bw=Math.max(2,Math.min(22,(slot*0.72-2)/2));
  let g="";for(let v=0;v<=top+1e-9;v+=st)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="'+(v===0?"base":"grid")+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" class="ax">'+kfmt(v)+'</text>';
  let bars="",hits="";
  bk.forEach((k,i)=>{const cx=L+slot*(i+.5);
    bars+='<path class="b-in" d="'+barPath(cx-bw-1,y(k.e),bw,ph+T-y(k.e))+'"/><path class="b-out" d="'+barPath(cx+1,y(k.s),bw,ph+T-y(k.s))+'"/>';
    hits+='<rect class="hit" x="'+(L+slot*i)+'" y="'+T+'" width="'+slot+'" height="'+ph+'" data-tip="'+esc('<b>'+k.tip+'</b><span><i class="sw in"></i>Entradas '+brl(k.e)+'</span><span><i class="sw out"></i>Saídas '+brl(k.s)+'</span><span>Saldo '+brl(k.e-k.s)+'</span>')+'"/>'});
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Entradas e saídas por '+(bk.length&&bk[0].a===bk[0].b?"dia":"período")+'">'+g+bars+xLabels(bk,W,L,R).replace(/__H__/g,H-8)+hits+'</svg>';
}
function chartSaldo(bk){
  const W=chartW(),H=180,L=46,R=64,T=14,B=26,ph=H-T-B;let acc=0;const pts=bk.map(k=>acc+=k.e-k.s);
  const lo=Math.min(0,...pts),hi=Math.max(0,...pts),st=niceStep((hi-lo)||1,4),a=Math.floor(lo/st)*st,b=Math.max(a+st,Math.ceil(hi/st)*st);
  const y=v=>T+ph-((v-a)/(b-a))*ph, slot=(W-L-R)/bk.length, x=i=>L+slot*(i+.5);
  let g="";for(let v=a;v<=b+1e-9;v+=st)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="'+(Math.abs(v)<1e-9?"base":"grid")+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" class="ax">'+kfmt(v)+'</text>';
  const line=pts.map((v,i)=>(i?"L":"M")+x(i)+","+y(v)).join(""), area=line+"L"+x(pts.length-1)+","+y(0)+"L"+x(0)+","+y(0)+"Z";
  const last=pts[pts.length-1]||0, lx=x(pts.length-1), ly=y(last);
  let hits="";bk.forEach((k,i)=>hits+='<rect class="hit" x="'+(L+slot*i)+'" y="'+T+'" width="'+slot+'" height="'+ph+'" data-x="'+x(i)+'" data-tip="'+esc('<b>Até '+k.tip+'</b><span>Saldo acumulado '+brl(pts[i])+'</span><span>No dia/período '+brl(k.e-k.s)+'</span>')+'"/>');
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Saldo acumulado no período">'+g+'<path d="'+area+'" class="sal-area"/><path d="'+line+'" class="sal-line"/><circle cx="'+lx+'" cy="'+ly+'" r="5" class="sal-end"/><text x="'+(lx+9)+'" y="'+(ly+4)+'" class="ax strong">'+kfmt(last)+'</text>'+xLabels(bk,W,L,R).replace(/__H__/g,H-8)+'<line class="xhair" x1="0" x2="0" y1="'+T+'" y2="'+(T+ph)+'" hidden/>'+hits+'</svg>';
}
function delta(cur,prev,invert){
  if(!prev&&!cur)return '<small class="dl">sem movimento</small>';
  if(!prev)return '<small class="dl">sem base anterior</small>';
  const p=Math.round((cur-prev)/Math.abs(prev)*100), good=invert?p<=0:p>=0;
  return '<small class="dl '+(p===0?"":good?"up":"down")+'">'+(p>0?"▲ ":p<0?"▼ ":"")+Math.abs(p)+'% vs '+NOME_PER[per.modo]+' anterior</small>';
}

function vCaixa(){

  const man=tx.filter(t=>t.categoria==="Manutenção"), pecas=man.reduce((a,t)=>a+(+t.pecas||0),0), mao=man.reduce((a,t)=>a+(+t.maoDeObra||0),0);
  const cats={};tx.filter(t=>t.tipo==="despesa").forEach(t=>cats[t.categoria]=(cats[t.categoria]||0)+(+t.valor||0));
  const porV=S.veiculos.map(v=>{const t=tx.filter(x=>x.veiculoId===v.id);return{v,e:sumT(t,"receita"),s:sumT(t,"despesa")}}).filter(r=>r.e||r.s).sort((a,b)=>(b.e-b.s)-(a.e-a.s));
  const list=tx.filter(t=>filtroTipo==="todos"||t.tipo===filtroTipo).sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.criadoEm||0)-(a.criadoEm||0));
  return monthBar()+
  '<section class="sec"><div class="kpis"><div class="kpi in"><span class="eyebrow">Entradas</span><b class="num">'+brl(ent)+'</b></div><div class="kpi out"><span class="eyebrow">Saídas</span><b class="num">'+brl(sai)+'</b></div><div class="kpi bal"><span class="eyebrow">Saldo</span><b class="num" style="color:var('+(ent-sai>=0?"--in":"--out")+')">'+brl(ent-sai)+'</b></div></div>'+
  '<div class="actions"><button class="btn pri" data-act="new-receita">'+IC.inn.replace("<svg",'<svg width="16" height="16"')+'Nova receita</button><button class="btn" data-act="new-despesa">'+IC.out.replace("<svg",'<svg width="16" height="16"')+'Nova despesa</button><button class="btn" data-act="manut">'+IC.wrench.replace("<svg",'<svg width="16" height="16"')+'Manutenção</button><button class="btn" data-act="export-caixa">'+IC.sheet+'Exportar planilha</button></div></section>'+
  '<section class="sec"><div class="sec-h"><h2>Lançamentos</h2><div class="seg" role="group" aria-label="Filtrar">'+[["todos","Todos"],["receita","Entradas"],["despesa","Saídas"]].map(([k,t])=>'<label><input type="radio" name="ft" value="'+k+'" data-act="filtro"'+(filtroTipo===k?" checked":"")+'><span>'+t+'</span></label>').join("")+'</div></div>'+
  (list.length?'<div class="panel">'+list.map(txRow).join("")+'</div>':'<div class="empty">Nenhum lançamento em '+esc(ymLabel(mes))+'.</div>')+'</section>'+
  (sai?'<section class="sec"><div class="sec-h"><h2>Para onde foi o dinheiro</h2></div><div class="panel tbl-wrap"><table><tbody>'+Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td class="r num">'+brl(v)+'</td><td class="r num muted">'+Math.round(v/sai*100)+'%</td></tr>'+(k==="Manutenção"?'<tr><td class="muted">&nbsp;&nbsp;↳ Peças</td><td class="r num muted">'+brl(pecas)+'</td><td></td></tr><tr><td class="muted">&nbsp;&nbsp;↳ Mão de obra</td><td class="r num muted">'+brl(mao)+'</td><td></td></tr>':"")).join("")+'</tbody></table></div></section>':"")+
  (porV.length?'<section class="sec"><div class="sec-h"><h2>Resultado por veículo</h2></div><div class="panel tbl-wrap"><table><thead><tr><th>Veículo</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Resultado</th></tr></thead><tbody>'+porV.map(r=>'<tr><td>'+esc(veicLabel(r.v))+'</td><td class="r num money in">'+brl(r.e)+'</td><td class="r num money out">'+brl(r.s)+'</td><td class="r num"><b style="color:var('+(r.e-r.s>=0?"--in":"--out")+')">'+brl(r.e-r.s)+'</b></td></tr>').join("")+'</tbody></table></div></section>':"");

function render(){
  if(!VIEWS[view])view="painel";
  let pre="";
  if(dbState==="none")pre='<div class="banner"><b>Os dados não estão sendo salvos.</b> Abra este app pelo claude.ai com a sua conta para cadastrar e guardar veículos, clientes e lançamentos.</div>';
  else if(dbState==="slow")pre='<div class="banner">Não consegui falar com o banco de dados ainda. Verifique sua conexão; os dados aparecem assim que ele responder.</div>';
  else if(dbState==="error")pre='<div class="banner">A conexão com o banco de dados caiu. Recarregue a página para continuar.</div>';
  if(readOnly)pre+='<div class="banner">Você tem acesso só para visualizar. Peça ao dono do app acesso de editor para lançar dados.</div>';
  $("#main").innerHTML=pre+VIEWS[view]();
  document.querySelectorAll("#nav button").forEach(b=>{if(b.dataset.view===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  $("#sync").textContent=dbState==="ok"?"Dados salvos na nuvem":dbState==="none"?"Modo de visualização":"Conectando…";
}

function F(label,name,val,type,extra){type=type||"text";extra=extra||"";
  if(type==="textarea")return '<label class="f'+(extra.includes("full")?" full":"")+'">'+label+'<textarea id="f-'+name+'" name="'+name+'">'+esc(val)+'</textarea></label>';
  return '<label class="f'+(extra.includes("full")?" full":"")+'">'+label+'<input id="f-'+name+'" name="'+name+'" type="'+type+'" value="'+esc(val??"")+'" '+extra.replace("full","")+'></label>'}
function Sel(label,name,val,opts,extra){extra=extra||"";return '<label class="f'+(extra.includes("full")?" full":"")+'">'+label+'<select id="f-'+name+'" name="'+name+'">'+opts.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return '<option value="'+esc(v)+'"'+(String(v)===String(val??"")?" selected":"")+'>'+esc(t)+'</option>'}).join("")+'</select></label>'}
function Seg(name,val,opts){return '<div class="seg full" role="radiogroup">'+opts.map(([v,t])=>'<label><input type="radio" name="'+name+'" value="'+v+'"'+(val===v?" checked":"")+'><span>'+t+'</span></label>').join("")+'</div>'}

function aplicaGravidade(fator){

function collect(){
  const f=$("#frm"), o={};
  new FormData(f).forEach((v,k)=>{o[k]=typeof v==="string"?v.trim():v});
  f.querySelectorAll("input[type=checkbox]").forEach(c=>o[c.name]=c.checked);
  f.querySelectorAll("input[type=number]").forEach(i=>{o[i.name]=i.value===""?null:+i.value});
  return o;
}
function validate(kind,o){
  if(kind==="veiculo"){o.placa=normPlate(o.placa);o.chassi=(o.chassi||"").toUpperCase();o.motor=(o.motor||"").toUpperCase();if(!o.placa)return"Informe a placa do veículo.";if(!plateOk(o.placa))return"A placa precisa estar no formato ABC1D23 ou ABC1234.";if(S.veiculos.some(v=>v.placa===o.placa&&v.id!==sheet.id))return"Já existe um veículo com a placa "+o.placa+".";}
  if(kind==="cliente"){if(!o.nome)return"Informe o nome completo.";o.cpf=digits(o.cpf);if(o.cpf&&!cpfOk(o.cpf))return"O CPF informado é inválido. Confira os números.";if(o.cpf&&S.clientes.some(c=>c.cpf===o.cpf&&c.id!==sheet.id))return"Já existe um cliente com esse CPF.";}
  if(kind==="locacao"){if(!o.clienteId)return"Escolha o cliente.";if(!o.veiculoId)return"Escolha o veículo.";if(!o.valor)return"Informe o valor da locação.";if(!o.inicio)return"Informe a data de início.";if(o.status==="encerrada"&&!o.fim)o.fim=todayIso();}
  if(kind==="multa"){if(!o.veiculoId)return"Escolha o veículo multado.";if(!o.dataInfracao)return"Informe a data da infração.";if(!o.infracao)return"Escolha a infração.";if(o.infracao==="outra"&&!o.descricaoInfracao)return"Descreva a infração.";if(!o.valor)return"Informe o valor da multa.";if(o.pagamento==="paga"&&!o.dataPagamento)o.dataPagamento=todayIso();if(o.pagamento==="paga"&&!o.valorPago)o.valorPago=o.valor;if(o.cobranca==="recebida"&&!o.clienteId)return"Escolha o condutor que pagou a multa.";}
  if(kind==="lanc"){if(!o.valor||o.valor<=0)return"Informe um valor maior que zero.";if(!o.data)return"Informe a data.";if(o.tipo!=="receita")o.locacaoId="";if(o.categoria!=="Manutenção"){delete o.pecas;delete o.maoDeObra;delete o.oficina;delete o.km;delete o.trocaOleo;delete o.revisao}else if((o.trocaOleo||o.revisao)&&!o.km)return"Informe o km do serviço para registrar a troca de óleo ou revisão."
    if(o.locacaoId&&!o.clienteId){const l=byId("locacoes",o.locacaoId);if(l)o.clienteId=l.clienteId}if(!o.locacaoId)o.clienteId="";}
  return null;
}

async function save(){
  if(!sheet||!db)return toast("Os dados só podem ser salvos com o app aberto pelo claude.ai.");
  if(sheet.kind==="empresa"){const o=collect();if(!o.nome)return toast("Informe o nome da empresa.");try{await db.doc("config/empresa").set(Object.assign({},o,{atualizadoEm:Date.now()}));closeSheet();toast("Dados da locadora salvos")}catch(e){dbErr(e)}return}
  if(sheet.kind==="km"){const o=collect(),v=byId("veiculos",sheet.id);if(o.km==null)return toast("Informe a quilometragem.");if(v.km!=null&&o.km<+v.km)return toast("A quilometragem não pode ser menor que a anterior ("+Number(v.km).toLocaleString("pt-BR")+" km).");const d=Object.assign({},v,{km:o.km,kmAtualizadoEm:todayIso()});delete d.id;try{await db.collection("veiculos").doc(v.id).set(d);closeSheet();toast("Quilometragem atualizada")}catch(e){dbErr(e)}return}
  const o=collect(), err=validate(sheet.kind,o);
  if(err)return toast(err);
  const col=sheet.col, prev=sheet.id?byId(col,sheet.id):null;
  const data=Object.assign({},prev||{},o,{atualizadoEm:Date.now()});
  delete data.id; if(!prev)data.criadoEm=Date.now(); delete data.exemplo; if(prev&&prev.exemplo)data.exemplo=true;
  const btn=$("#frm button[type=submit]");btn.disabled=true;
  try{
    if(sheet.kind==="multa"){
      const ref=sheet.id?db.collection(col).doc(sheet.id):db.collection(col).doc(), desc=infrTxt(data)+(data.numeroAuto?" · AIT "+data.numeroAuto:"");
      if(data.pagamento==="paga"&&!data.lancPagoId){const r=await db.collection("lancamentos").add({tipo:"despesa",categoria:"Multa",valor:data.valorPago||data.valor,data:data.dataPagamento,veiculoId:data.veiculoId,locacaoId:"",clienteId:"",formaPagamento:"Boleto",descricao:"Multa paga: "+desc,multaId:ref.id,criadoEm:Date.now()});data.lancPagoId=r.id}
      if(data.cobranca==="recebida"&&!data.lancRecebidoId){const r=await db.collection("lancamentos").add({tipo:"receita",categoria:"Multa repassada ao cliente",valor:data.valorPago||data.valor,data:todayIso(),veiculoId:data.veiculoId,locacaoId:"",clienteId:data.clienteId,formaPagamento:"Pix",descricao:"Reembolso de multa: "+desc,multaId:ref.id,criadoEm:Date.now()});data.lancRecebidoId=r.id}
      await ref.set(data);
    }
    else if(sheet.id)await db.collection(col).doc(sheet.id).set(data);else await db.collection(col).add(data);
    if(sheet.kind==="locacao"&&!prev&&o.caucao>0)await db.collection("lancamentos").add({tipo:"receita",categoria:"Caução",valor:o.caucao,data:o.inicio,veiculoId:o.veiculoId,locacaoId:"",clienteId:o.clienteId,formaPagamento:"Pix",descricao:"Caução da locação",criadoEm:Date.now()});
    if(sheet.kind==="lanc"&&o.categoria==="Manutenção"&&o.veiculoId){const v=byId("veiculos",o.veiculoId);if(v){const d=Object.assign({},v),km=+o.km||0;delete d.id;let ch=false;if(km&&km>(+v.km||0)){d.km=km;ch=true}if(o.trocaOleo&&km){d.oleoUltimaKm=km;ch=true}if(o.revisao&&km){d.revUltimaKm=km;ch=true}if(ch)await db.collection("veiculos").doc(v.id).set(d)}}
    if(sheet.kind==="locacao"&&o.veiculoId){const v=byId("veiculos",o.veiculoId),km=Math.max(+o.kmFim||0,+o.kmInicio||0);if(v&&km>(+v.km||0)){const d=Object.assign({},v,{km});delete d.id;await db.collection("veiculos").doc(v.id).set(d)}}
    const msg={veiculo:"Veículo salvo",cliente:"Cliente salvo",locacao:"Locação salva",lanc:"Lançamento salvo",multa:"Multa salva"}[sheet.kind];
    closeSheet();toast(msg);
  }catch(e){btn.disabled=false;dbErr(e)}
}
async function del(){

  if(!sheet.confirmDel){
    const deps=sheet.kind==="veiculo"?S.locacoes.filter(l=>l.veiculoId===sheet.id&&l.status!=="encerrada").length:sheet.kind==="cliente"?S.locacoes.filter(l=>l.clienteId===sheet.id&&l.status!=="encerrada").length:0;
    if(deps)return toast("Encerre a locação ativa antes de excluir.");
    sheet.confirmDel=true;btn.textContent="Toque de novo para excluir";btn.classList.add("pri");btn.style.background="var(--out)";btn.style.borderColor="var(--out)";btn.style.color="#fff";return;

async function delLanc(id){
  const t=byId("lancamentos",id);if(!t||!db)return;
  await db.collection("lancamentos").doc(id).delete();
  if(t.multaId){const m=byId("multas",t.multaId);if(m){const d=Object.assign({},m);delete d.id;
    if(m.lancPagoId===id){delete d.lancPagoId;d.pagamento="aberta";delete d.dataPagamento;delete d.valorPago}
    if(m.lancRecebidoId===id){delete d.lancRecebidoId;d.cobranca="a_cobrar"}
    await db.collection("multas").doc(m.id).set(d)}}
}

const UN=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"],DZ=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"],CT=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
function ext3(n){if(n===100)return"cem";const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(CT[c]);if(r<20){if(r)p.push(UN[r])}else{const d=Math.floor(r/10),u=r%10;p.push(DZ[d]+(u?" e "+UN[u]:""))}return p.join(" e ")}
function extInt(n){if(n===0)return"zero";const mi=Math.floor(n/1e6),mil=Math.floor(n%1e6/1000),r=n%1000,g=[];
  if(mi)g.push([mi===1?"um milhão":ext3(mi)+" milhões",mi*1e6]);if(mil)g.push([mil===1?"mil":ext3(mil)+" mil",mil*1000]);if(r)g.push([ext3(r),r]);
  return g.map((x,i)=>i===0?x[0]:((i===g.length-1&&(x[1]<100||x[1]%100===0))?" e ":" ")+x[0]).join("")}
function extenso(v){const c=Math.round((+v||0)*100),re=Math.floor(c/100),ce=c%100;let s="";
  if(re)s=extInt(re)+(re===1?" real":(re%1e6===0?" de reais":" reais"));if(ce)s+=(s?" e ":"")+extInt(ce)+(ce===1?" centavo":" centavos");return s||"zero reais"}

async function novoPdf(titulo){
  const {jsPDF}=await loadLib("jspdf");const doc=new jsPDF({unit:"mm",format:"a4"}),M=18,W=210-2*M;let y=16;const logo=await getLogo();
  if(logo)doc.addImage(logo,"PNG",M,y-2,17,17.4,"logo","FAST");
  const x0=logo?M+21:M;doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(EMP.nome||"Locadora",x0,y+3);
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(90);
  [[EMP.documento?(digits(EMP.documento).length>11?"CNPJ ":"CPF ")+EMP.documento:"",EMP.telefone].filter(Boolean).join("  ·  "),[EMP.endereco,[EMP.cidade,EMP.uf].filter(Boolean).join("/")].filter(Boolean).join(" - ")].forEach((t,i)=>t&&doc.text(t,x0,y+8+i*4));
  doc.setTextColor(0);y+=20;doc.setDrawColor(40,52,71);doc.setLineWidth(.6);doc.line(M,y,M+W,y);y+=9;
  doc.setFont("helvetica","bold");doc.setFontSize(13.5);doc.text(titulo,105,y,{align:"center"});y+=8;
  const P={doc,M,W,
    get y(){return y},set y(v){y=v},
    need(h){if(y+h>282){doc.addPage();y=18}},
    sec(t){P.need(12);y+=2;doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(40,52,71);doc.text(t.toUpperCase(),M,y);doc.setTextColor(0);y+=1.6;doc.setDrawColor(200);doc.setLineWidth(.2);doc.line(M,y,M+W,y);y+=5},
    p(t,o){o=o||{};doc.setFont("helvetica",o.bold?"bold":"normal");doc.setFontSize(o.size||10);const ls=doc.splitTextToSize(t,W-(o.indent||0));ls.forEach(l=>{P.need(5);doc.text(l,M+(o.indent||0),y,o.justify&&false?{align:"justify",maxWidth:W}:undefined);y+=(o.size||10)*0.45});y+=o.gap??2},
    kv(rows){doc.setFontSize(9.5);const cw=W/2;for(let i=0;i<rows.length;i+=2){P.need(10);[rows[i],rows[i+1]].forEach((r,j)=>{if(!r)return;doc.setFont("helvetica","normal");doc.setTextColor(100);doc.text(r[0],M+j*cw,y);doc.setTextColor(0);doc.setFont("helvetica","bold");doc.text(doc.splitTextToSize(String(r[1]||"—"),cw-4)[0],M+j*cw,y+4.4)});y+=10}},
    assin(nomes){P.need(30);y+=16;const n=nomes.length,cw=W/n;nomes.forEach((t,i)=>{const cx=M+cw*i+cw/2;doc.setDrawColor(0);doc.setLineWidth(.3);doc.line(cx-cw/2+6,y,cx+cw/2-6,y);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text(t[0],cx,y+4.5,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(8.5);if(t[1])doc.text(t[1],cx,y+8.8,{align:"center"})});y+=14},
    async salvar(nome){const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(130);doc.text("Página "+i+" de "+n,105,290,{align:"center"})}await salvarArquivo(nome,doc.output("arraybuffer"))}
  };
  return P;
}

  const z='"R$" #,##0.00;[Red]-"R$" #,##0.00';for(let r=1;r<=rows.length;r++){["H","I","J"].forEach(col=>{const cell=ws[col+(r+1)];if(cell)cell.z=z});const d=ws["A"+(r+1)];if(d)d.z="dd/mm/yyyy"}
  X.utils.book_append_sheet(wb,ws,"Lançamentos");
  const cats={};tx.forEach(t=>{const k=(t.tipo==="receita"?"Entrada":"Saída")+"|"+t.categoria;cats[k]=(cats[k]||0)+(+t.valor||0)});
  const res=[["Fluxo de caixa",EMP.nome||""],["Período",fd(ini)+" a "+fd(fim)],[],["Total de entradas",ent],["Total de saídas",sai],["Saldo",ent-sai],[],["Tipo","Categoria","Valor"],...Object.entries(cats).sort().map(([k,v])=>[...k.split("|"),v])];
  const ws2=X.utils.aoa_to_sheet(res);ws2["!cols"]=[{wch:22},{wch:30},{wch:14}];["B4","B5","B6"].forEach(a=>{if(ws2[a])ws2[a].z=z});for(let r=9;r<=res.length;r++){const cl=ws2["C"+r];if(cl)cl.z=z}
  X.utils.book_append_sheet(wb,ws2,"Resumo");
  await salvarArquivo("Caixa-"+slug(rotulo)+".xlsx",X.write(wb,{type:"array",bookType:"xlsx"}));
}

/* ---------- manutenção por km ---------- */
function kmInfo(v){const km=+v.km||0,out=[];
  [["oleo","Troca de óleo","oleoIntervalo","oleoUltimaKm"],["rev","Revisão","revIntervalo","revUltimaKm"]].forEach(([k,nome,iv,ul])=>{const I=+v[iv],U=+v[ul];if(!I||v[ul]==null||v[ul]==="")return;const resta=U+I-km,lim=Math.max(200,I*0.1);
    if(resta<=0)out.push({k,txt:nome+" atrasada "+Math.abs(resta).toLocaleString("pt-BR")+" km",cls:"bad",prox:U+I});else if(resta<=lim)out.push({k,txt:nome+" em "+resta.toLocaleString("pt-BR")+" km",cls:"warn",prox:U+I});else out.push({k,txt:nome+" aos "+(U+I).toLocaleString("pt-BR")+" km",cls:"",prox:U+I})});
  return out}
function formKm(v){
  openSheet("Atualizar quilometragem",'<div class="row">'+plateHtml(v)+'<div class="grow"><div class="t">'+esc([v.marca,v.modelo].filter(Boolean).join(" "))+'</div><div class="sub">Último registro: '+(v.km!=null?Number(v.km).toLocaleString("pt-BR")+" km":"—")+'</div></div></div>'+
  '<fieldset><div class="grid">'+F("Km atual do painel","km",v.km,"number",'inputmode="numeric" min="0" class="full" required')+'</div></fieldset>',{kind:"km",id:v.id,col:"veiculos"});
  const d=document.querySelector('[data-act="del"]');if(d)d.remove();
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const nb=e.target.closest("[data-view]");if(nb&&nb.closest("#nav"))return go(nb.dataset.view);
  const vg=e.target.closest("[data-view-go]");if(vg)return go(vg.dataset.viewGo);
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act, id=a.dataset.id;
  if(act==="close-bg"&&e.target!==a)return;
  if(a.tagName==="A")return;
  switch(act){
    case "close":case "close-bg":return closeSheet();
    case "del":return del();
    case "mes-prev":mes=ymShift(mes,-1);return render();
    case "mes-next":mes=ymShift(mes,1);return render();
    case "new-veiculo":return formVeiculo();
    case "edit-veiculo":return formVeiculo(byId("veiculos",id));
    case "new-cliente":return formCliente();
    case "edit-cliente":return formCliente(byId("clientes",id));
    case "new-locacao":if(!S.veiculos.length||!S.clientes.length)return toast("Cadastre um veículo e um cliente primeiro.");return formLocacao();
    case "edit-locacao":return formLocacao(byId("locacoes",id));
    case "new-receita":return formLanc({tipo:"receita",categoria:MENS});
    case "new-despesa":return formLanc({tipo:"despesa",categoria:DESP[1]});
    case "manut":return formLanc({tipo:"despesa",categoria:"Manutenção",veiculoId:id||""});
    case "quick":return formLanc({tipo:"receita",categoria:MENS});
    case "edit-lanc":return formLanc(byId("lancamentos",id));
    case "pagar":{const l=byId("locacoes",id);if(!l)return;const i=locInfo(l);return formLanc({tipo:"receita",categoria:MENS,locacaoId:l.id,veiculoId:l.veiculoId,valor:l.valor,data:todayIso(),descricao:"Pagamento referente a "+fd(i.prox)})}
    case "clear-ex":return clearExamples();
    case "empresa":return formEmpresa();
    case "contrato":{const l=byId("locacoes",id);return l&&gerando(()=>pdfContrato(l))}
    case "indicacao":{const m=byId("multas",id);return m&&gerando(()=>pdfIndicacao(m))}
    case "recibo":{const t=byId("lancamentos",id);return t&&abrirRecibo(t)}
    case "recibo-pdf":{const t=byId("lancamentos",id);return t&&gerando(()=>pdfRecibo(t))}
    case "copiar":{const txt=a.dataset.txt;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Texto copiado")).catch(()=>toast("Não deu para copiar automaticamente."));return}
    case "export-caixa":{const[y,mm]=mes.split("-").map(Number);return exportarPlanilha(mes+"-01",iso(new Date(y,mm,0)),ymLabel(mes))}
    case "export-per":return exportarPlanilha(per.ini,per.fim,perLabel(per));
    case "km":{const v=byId("veiculos",id);return v&&formKm(v)}
    case "per-prev":shiftPer(-1);return render();
    case "per-next":shiftPer(1);return render();
    case "per-hoje":per=periodoDe(per.modo==="livre"?"semana":per.modo,todayIso());return render();
    case "del-lanc":
      if(pendDel!==id){pendDel=id;clearTimeout(pendT);pendT=setTimeout(()=>{pendDel=null;render()},5000);return render()}
      pendDel=null;clearTimeout(pendT);return delLanc(id).then(()=>toast("Lançamento excluído")).catch(dbErr);
    case "new-multa":if(!S.veiculos.length)return toast("Cadastre um veículo primeiro.");return formMulta();
    case "edit-multa":return formMulta(byId("multas",id));
  }
});
document.addEventListener("change",e=>{
  if(e.target.dataset.act==="filtro"){filtroTipo=e.target.value;render()}
  if(e.target.dataset.act==="pmodo"){const m=e.target.value;if(m!=="livre")per=periodoDe(m,per.ini<=todayIso()&&todayIso()<=per.fim?todayIso():per.ini);else per={modo:"livre",ini:per.ini,fim:per.fim};render()}
  if(e.target.id==="per-ini"||e.target.id==="per-fim"){let a=$("#per-ini").value,b=$("#per-fim").value;if(!a||!b)return;if(a>b){if(e.target.id==="per-ini")b=a;else a=b}if(days(a,b)>1100)return toast("Escolha um período de até 3 anos.");per={modo:"livre",ini:a,fim:b};render()}
});
/* dica ao passar o dedo ou o mouse sobre os gráficos */
function showTip(r){const box=r.closest(".chartbox"),tip=box&&box.querySelector(".tip");if(!tip)return;tip.innerHTML=r.dataset.tip;tip.hidden=false;
  const bb=box.getBoundingClientRect(),rb=r.getBoundingClientRect();let x=rb.left-bb.left+rb.width/2-tip.offsetWidth/2;x=Math.max(6,Math.min(bb.width-tip.offsetWidth-6,x));tip.style.left=x+"px";tip.style.top="6px";
  const xh=box.querySelector(".xhair");if(xh&&r.dataset.x){xh.setAttribute("x1",r.dataset.x);xh.setAttribute("x2",r.dataset.x);xh.removeAttribute("hidden")}}
function hideTip(box){if(!box)return;const t=box.querySelector(".tip");if(t)t.hidden=true;const xh=box.querySelector(".xhair");if(xh)xh.setAttribute("hidden","")}
document.addEventListener("pointerover",e=>{const r=e.target.closest&&e.target.closest(".hit");if(r)showTip(r)});
document.addEventListener("pointerout",e=>{const r=e.target.closest&&e.target.closest(".hit");if(r&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest(".hit")))hideTip(r.closest(".chartbox"))});
document.addEventListener("pointerdown",e=>{const r=e.target.closest&&e.target.closest(".hit");if(r)showTip(r);else document.querySelectorAll(".chartbox").forEach(hideTip)});
let rzT,lastW=window.innerWidth;window.addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(view==="painel"&&Math.abs(window.innerWidth-lastW)>20){lastW=window.innerWidth;render()}},200)});
document.addEventListener("submit",e=>{e.preventDefault();save()});
document.addEventListener("input",e=>{
  if(e.target.id==="q-veiculos"){q.veiculos=e.target.value;$("#list").innerHTML=listVeiculos()}
  if(e.target.id==="q-clientes"){q.clientes=e.target.value;$("#list").innerHTML=listClientes()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet)closeSheet()});

/* ---------- banco de dados ---------- */
document.querySelector(".head-ic").innerHTML=IC.gear;
render();
const use=window.claude&&window.claude.use;
if(!use){dbState="none";render()}
else window.claude.use("db").then(d=>{
  if(!d){dbState="none";render();return}
  db=d;
  const timer=setTimeout(()=>{if(dbState==="loading"){dbState="slow";render()}},10000);
  db.doc("config/empresa").onSnapshot(d=>{EMP=d.exists?Object.assign({},d.data()):{};render()},()=>{});
  COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{
    S[c]=snap.docs.map(x=>Object.assign({id:x.id},x.data()));
    if(!snap.metadata.fromCache)loaded.add(c);
    if(loaded.size===COLS.length&&dbState!=="ok"){dbState="ok";clearTimeout(timer)}
    render();
  },err=>{clearTimeout(timer);dbState="error";render()}));
}).catch(()=>{dbState="none";render()});
})();
</script>
